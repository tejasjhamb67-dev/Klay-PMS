name: Deployment diagnostics

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch: {}

permissions:
  deployments: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deployments recorded on this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/deployments?per_page=10" > deps.json
          echo "== DEPLOYMENTS =="
          jq -r '.[] | "\(.id) env=\(.environment) ref=\(.ref) sha=\(.sha[0:7]) at=\(.created_at)"' deps.json
          echo "== LATEST STATUS PER DEPLOYMENT =="
          for id in $(jq -r '.[].id' deps.json); do
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" |
              jq -r --arg id "$id" '.[] | "dep=\($id) state=\(.state) URL=\(.environment_url // "none") log=\(.target_url // "none")"'
          done

      - name: Probe candidate public URLs
        run: |
          for u in https://klay-pms.vercel.app https://klay-pms-tj2.vercel.app; do
            echo "$u -> HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$u")"
          done
