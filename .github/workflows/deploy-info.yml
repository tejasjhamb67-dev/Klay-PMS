name: Deployment diagnostics

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch: {}

permissions:
  deployments: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deployments recorded on this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/deployments?per_page=10" > deps.json
          echo "== DEPLOYMENTS =="
          jq -r '.[] | "\(.id) env=\(.environment) ref=\(.ref) sha=\(.sha[0:7]) at=\(.created_at)"' deps.json
          echo "== LATEST STATUS PER DEPLOYMENT =="
          for id in $(jq -r '.[].id' deps.json); do
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" |
              jq -r --arg id "$id" '.[] | "dep=\($id) state=\(.state) URL=\(.environment_url // "none") log=\(.target_url // "none")"'
          done

      - name: Probe live-quote APIs for browser (CORS) usability
        run: |
          ORIGIN="https://tejasjhamb67-dev.github.io"
          YURL="https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI?range=1d&interval=5m"
          probe () {
            echo "== $1 =="
            curl -s -D /tmp/h -o /tmp/b --max-time 20 -H "Origin: $ORIGIN" "$2" || true
            grep -iE "^(HTTP|access-control-allow-origin)" /tmp/h || echo "(no CORS header)"
            head -c 220 /tmp/b; echo; echo
          }
          probe "yahoo direct"        "$YURL"
          probe "allorigins+yahoo"    "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$YURL', safe=''))")"
          probe "corsproxy.io+yahoo"  "https://corsproxy.io/?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$YURL', safe=''))")"
          probe "er-api USD"          "https://open.er-api.com/v6/latest/USD"
          probe "allorigins+goldbees" "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://query1.finance.yahoo.com/v8/finance/chart/GOLDBEES.NS?range=1d&interval=15m', safe=''))")"
